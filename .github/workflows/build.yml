name: Build Android APK

on:
  push:
    branches: [main, codex]
    paths:
      - 'mobile/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=dev

      - name: Test mobile app
        run: npm test

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Verify and prepare APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose "$apk"
          mkdir -p apk
          cp "$apk" apk/hrecos-riverwatch.apk
          cd apk
          sha256sum hrecos-riverwatch.apk > hrecos-riverwatch.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hrecos-riverwatch-apk
          path: mobile/apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
