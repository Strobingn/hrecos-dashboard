name: Deploy - Production

# Deploy runs *after* Docker Publish succeeds, so the images it pulls exist.
# A tag push (v*) therefore flows: publish -> deploy.
on:
  workflow_run:
    workflows: [ 'Docker Publish' ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - staging
        - production

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/hrecos-dashboard
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # For workflow_run, deploy the exact commit that was just published.
        ref: ${{ github.event.workflow_run.head_sha || github.ref }}

    - name: Resolve image tag
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_run" ]; then
          echo "value=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
        else
          echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add host to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

    - name: Create environment file
      run: |
        umask 077
        cat > .env.deploy <<EOF
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        SECRET_KEY=${{ secrets.SECRET_KEY }}
        HRECOS_CORS_ORIGINS=${{ secrets.HRECOS_CORS_ORIGINS }}
        EMAIL_ENABLED=${{ secrets.EMAIL_ENABLED }}
        SMTP_USER=${{ secrets.SMTP_USER }}
        SMTP_PASS=${{ secrets.SMTP_PASS }}
        ALERT_EMAIL=${{ secrets.ALERT_EMAIL }}
        SMS_ENABLED=${{ secrets.SMS_ENABLED }}
        TWILIO_SID=${{ secrets.TWILIO_SID }}
        TWILIO_TOKEN=${{ secrets.TWILIO_TOKEN }}
        TWILIO_FROM=${{ secrets.TWILIO_FROM }}
        ALERT_PHONE=${{ secrets.ALERT_PHONE }}
        SLACK_ENABLED=${{ secrets.SLACK_ENABLED }}
        SLACK_WEBHOOK=${{ secrets.SLACK_WEBHOOK }}
        EOF

    - name: Copy deployment files to server
      run: |
        ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'mkdir -p ~/hrecos-dashboard'
        scp docker-compose.prod.yml Caddyfile nginx.conf .env.deploy \
          ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/hrecos-dashboard/
        scp -r init-scripts \
          ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/hrecos-dashboard/
        ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          'mv ~/hrecos-dashboard/.env.deploy ~/hrecos-dashboard/.env && chmod 600 ~/hrecos-dashboard/.env'

    - name: Pull and start services
      env:
        IMAGE_TAG: ${{ steps.tag.outputs.value }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Pass the registry token on stdin so it never appears in a process list.
        printenv GH_TOKEN | ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
          cd ~/hrecos-dashboard
          docker login ghcr.io -u ${{ github.actor }} --password-stdin
          export IMAGE_PREFIX='${{ env.IMAGE_PREFIX }}'
          export IMAGE_TAG='$IMAGE_TAG'
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -af
          sleep 30
          curl -fsS http://localhost/health || exit 1
        "

    - name: Notify deployment
      if: always() && env.SLACK_WEBHOOK_URL != ''
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: 'HRECOS Dashboard deployed to production'
      env:
        SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
