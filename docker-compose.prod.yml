# Production stack — standalone (do NOT combine with docker-compose.yml).
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Required environment:
#   DB_PASSWORD   (no default — compose refuses to start without it)
#   SECRET_KEY    (no default — compose refuses to start without it)
# Optional:
#   IMAGE_PREFIX  container registry prefix (default: ghcr.io/strobingn/hrecos-dashboard)
#   IMAGE_TAG     image tag to deploy (default: latest; CI passes the release tag)
#   HRECOS_CORS_ORIGINS  comma-separated allowed origins (default: *)
#
# Images are built and pushed by .github/workflows/docker-publish.yml.

services:
  db:
    image: timescale/timescaledb:latest-pg14
    container_name: hrecos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: hrecos
    volumes:
      - /data/postgres:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hrecos-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  backend:
    # No bind mounts and no --reload: this runs the image exactly as built.
    image: ${IMAGE_PREFIX:-ghcr.io/strobingn/hrecos-dashboard}-backend:${IMAGE_TAG:-latest}
    container_name: hrecos-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD}@db:5432/hrecos
      - HRECOS_CORS_ORIGINS=${HRECOS_CORS_ORIGINS:-*}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - FROM_EMAIL=${FROM_EMAIL:-alerts@hrecos-dashboard.local}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - SMS_ENABLED=${SMS_ENABLED:-false}
      - TWILIO_SID=${TWILIO_SID:-}
      - TWILIO_TOKEN=${TWILIO_TOKEN:-}
      - TWILIO_FROM=${TWILIO_FROM:-}
      - ALERT_PHONE=${ALERT_PHONE:-}
      - SLACK_ENABLED=${SLACK_ENABLED:-false}
      - SLACK_WEBHOOK=${SLACK_WEBHOOK:-}
    networks:
      - hrecos-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/strobingn/hrecos-dashboard}-frontend:${IMAGE_TAG:-latest}
    container_name: hrecos-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - hrecos-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # TLS-terminating reverse proxy. See Caddyfile for the domain/HTTPS switch.
  caddy:
    image: caddy:alpine
    container_name: hrecos-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - hrecos-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  hrecos-network:
    driver: bridge

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
